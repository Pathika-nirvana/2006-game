<!doctype html>
<meta charset="utf-8">
<title>오락기 연결 예제</title>
<body style="margin:0;background:#222;color:#fff;font:14px sans-serif">
<p style="padding:20px">이 파일은 부모 게임에서 격투 게임을 여는 방법을 보여 주는 예제입니다. 아래 버튼을 누르면 오락기 정면 화면이 전체 화면으로 열립니다.</p>
<button id="open" style="margin:0 20px;padding:10px 18px">오락기 켜기 (코인 100원)</button>
<p id="log" style="padding:20px;color:#9fd0ff"></p>
<script>
/* ---- 부모 게임에 붙일 부분 시작 ---- */
var GAME_URL = 'index.html';          // 실제 게임에서는 'assets/games/fighter/index.html'
var cover = null;                     // 전체 화면 덮개
function openArcade() {
  if (cover) return;
  cover = document.createElement('div');
  cover.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000';
  var fr = document.createElement('iframe');
  fr.src = GAME_URL;
  fr.style.cssText = 'width:100%;height:100%;border:0;display:block';
  fr.addEventListener('load', function () { fr.contentWindow.focus(); });
  cover.appendChild(fr);
  document.body.appendChild(cover);
  window.ARCADE_OPEN = true;          // 부모 게임은 이 값이 true인 동안 자기 키 입력을 무시한다
}
function closeArcade() {
  if (!cover) return;
  cover.remove(); cover = null;       // 덮개를 지우면 소리와 반복 실행이 함께 멈춘다
  window.ARCADE_OPEN = false;
  window.focus();
}
addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.source !== 'arcade-game' || d.game !== 'fighter') return;
  if (d.type === 'exit') closeArcade();                       // 제목 화면에서 Esc 또는 나가기
  if (d.type === 'score') console.log('격투 게임 점수', d.score, d.cleared ? '(끝까지 깸)' : '');
  document.getElementById('log').textContent = '받은 신호: ' + d.type + ' ' + JSON.stringify(d);
});
document.getElementById('open').onclick = openArcade;
/* ---- 부모 게임에 붙일 부분 끝 ---- */
</script>
